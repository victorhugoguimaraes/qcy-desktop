[package]
name = "qcy-desktop"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
btleplug = "0.11"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["time", "sync"] }
uuid = "1"
futures-util = "0.3"

serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
